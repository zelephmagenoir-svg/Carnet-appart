<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#1C2333" />
<title>Carnet d'appart</title>
<style>
  :root {
    --ink: #1C2333;
    --paper: #F6F1E4;
    --paper-input: #FFFDF7;
    --paper-border: #DCD3B8;
    --muted: #8A8368;
    --text: #2B2B24;
    --accent: #B84A3E;
    --accent-text: #FBF4E6;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  body { min-height: 100vh; padding-bottom: env(safe-area-inset-bottom); }
  .wrap { max-width: 480px; margin: 0 auto; padding-bottom: 110px; }
  header { padding: 24px 20px 12px; position: sticky; top: 0; background: var(--ink); z-index: 10; }
  header .row { display: flex; align-items: baseline; justify-content: space-between; }
  h1 { font-family: 'Courier New', monospace; letter-spacing: 0.02em; font-size: 24px; font-weight: 700; color: #fff; margin: 0; }
  .count { font-size: 14px; color: #8A93AD; }
  .filters { display: flex; gap: 8px; margin-top: 12px; overflow-x: auto; padding-bottom: 4px; }
  .chip { flex-shrink: 0; padding: 7px 13px; border-radius: 999px; font-size: 14px; border: 1px solid #3A425A; background: transparent; color: #B8C0D6; white-space: nowrap; }
  .chip.active-all { background: var(--paper); color: var(--text); border-color: var(--paper); }
  .sort-row { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
  .sort-row label { font-size: 12px; color: #8A93AD; }
  .sort-row select { flex: 1; background: #262E44; color: #E4E8F0; border: 1px solid #3A425A; border-radius: 8px; padding: 7px 8px; font-size: 14px; }
  main { padding: 0 20px; }
  .empty { text-align: center; padding: 64px 0; color: #8A93AD; }
  .card { position: relative; background: var(--paper); border-radius: 14px; margin-bottom: 16px; overflow: hidden; box-shadow: 0 1px 0 rgba(0,0,0,0.04), 0 4px 14px rgba(20,24,35,0.10); }
  .perf { display: flex; justify-content: space-between; padding: 8px 12px 0; }
  .perf span { width: 4px; height: 4px; border-radius: 4px; background: #E4DBC0; }
  .card-body { display: flex; gap: 12px; padding: 12px; }
  .thumb { flex-shrink: 0; width: 86px; height: 128px; border-radius: 10px; overflow: hidden; background: #EAE2CB; display: flex; align-items: center; justify-content: center; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .card-main { flex: 1; min-width: 0; }
  .card-top { display: flex; justify-content: space-between; gap: 8px; }
  .card-title { font-weight: 600; color: var(--text); margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card-actions { display: flex; gap: 4px; flex-shrink: 0; }
  .icon-btn { background: none; border: none; padding: 4px; color: #B0A99A; }
  .lieu { font-size: 13px; color: var(--muted); margin-top: 1px; }
  .rent { font-size: 14px; color: var(--muted); margin-top: 2px; }
  .type-tag { display: inline-block; font-size: 11px; padding: 2px 7px; border-radius: 999px; background: #E8E1CC; color: #6B6448; margin-top: 4px; }
  .links { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .pill { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; padding: 5px 9px; border-radius: 999px; text-decoration: none; }
  .pill.tel { background: #E4EFE1; color: #3C5A38; }
  .pill.url { background: #E4E8EF; color: #33415C; }
  .dates { display: flex; gap: 10px; flex-wrap: wrap; padding: 0 12px 6px; font-size: 12px; color: var(--muted); }
  .finance { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 14px; padding: 8px 12px; margin: 0 12px 10px; background: #EFE8D2; border-radius: 10px; font-size: 13px; color: #5C5847; }
  .finance .fline { display: flex; justify-content: space-between; }
  .finance .flabel { color: var(--muted); }
  .finance .cashflow-pos { color: #3C6B41; font-weight: 700; }
  .finance .cashflow-neg { color: #B84A3E; font-weight: 700; }
  .cashflow-display { display: flex; align-items: center; padding: 12px; border-radius: 10px; background: #EAE2CB; font-size: 16px; font-weight: 700; margin-bottom: 12px; }
  .notes { padding: 0 12px 8px; font-size: 14px; color: #5C5847; }
  .status-row { display: flex; gap: 6px; padding: 0 12px 12px; flex-wrap: wrap; }
  .status-btn { padding: 5px 10px; border-radius: 999px; font-size: 12px; font-weight: 500; background: transparent; }
  .stamp { position: absolute; top: 12px; right: 12px; transform: rotate(6deg); padding: 2px 8px; border-radius: 4px; font-family: 'Courier New', monospace; font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; opacity: 0.9; }
  .fab { position: fixed; z-index: 40; bottom: 24px; right: 24px; width: 56px; height: 56px; border-radius: 999px; background: var(--accent); color: var(--accent-text); border: none; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 20px rgba(184,74,62,0.4); }
  .sheet-overlay { position: fixed; inset: 0; background: rgba(20,24,35,0.55); z-index: 50; display: none; align-items: flex-end; justify-content: center; }
  .sheet-overlay.open { display: flex; }
  .sheet { width: 100%; max-width: 480px; max-height: 90vh; background: var(--paper); border-radius: 18px 18px 0 0; overflow: hidden; display: flex; flex-direction: column; }
  .sheet-handle { display: flex; justify-content: center; padding: 8px 0 4px; }
  .sheet-handle span { width: 40px; height: 4px; border-radius: 4px; background: #C9C0A4; }
  .sheet-content { overflow-y: auto; padding: 4px 20px 28px; }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .sheet-head h2 { font-family: 'Courier New', monospace; letter-spacing: 0.03em; text-transform: uppercase; font-size: 18px; color: var(--text); margin: 0; }
  .close-btn { background: none; border: none; padding: 4px; color: #5C5847; }
  .photo-btn { width: 100%; margin-bottom: 16px; border-radius: 12px; border: 2px dashed var(--paper-border); background: #EAE2CB; display: flex; align-items: center; justify-content: center; height: 100px; color: var(--muted); overflow: hidden; }
  .photo-btn.has-photo { height: 160px; background: transparent; }
  .photo-btn img { width: 100%; height: 100%; object-fit: cover; }
  .field { width: 100%; border-radius: 10px; padding: 12px; font-size: 16px; background: var(--paper-input); border: 1px solid var(--paper-border); color: var(--text); margin-bottom: 12px; font-family: inherit; }
  textarea.field { resize: none; }
  .field-row { display: flex; gap: 10px; }
  .field-row .field { flex: 1; }
  .field-label { font-size: 12px; color: var(--muted); margin: -6px 0 6px 2px; }
  .status-label { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 4px 0 8px; }
  .status-choices { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 4px; }
  .status-choice { padding: 8px 13px; border-radius: 999px; font-size: 14px; font-weight: 500; background: transparent; }
  .save-btn { width: 100%; margin-top: 20px; padding: 13px; border: none; border-radius: 12px; font-size: 16px; font-weight: 600; background: #D8D0B8; color: #FBF4E6; opacity: 0.7; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .save-btn.enabled { background: var(--accent); opacity: 1; }
  svg { display: block; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="row">
      <h1>Carnet d'appart</h1>
      <span class="count" id="count"></span>
    </div>
    <div class="filters" id="filters"></div>
    <div class="sort-row">
      <label for="sortSelect">Trier :</label>
      <select id="sortSelect">
        <option value="recent">Plus récent</option>
        <option value="loyer_asc">Prix croissant</option>
        <option value="loyer_desc">Prix décroissant</option>
        <option value="lieu">Lieu (A→Z)</option>
        <option value="visite">Date de visite</option>
        <option value="contact">Date de contact</option>
      </select>
    </div>
  </header>
  <main><div id="list"><div class="empty">Connexion…</div></div></main>
</div>

<button class="fab" id="fabBtn" aria-label="Ajouter une fiche">
  <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#FBF4E6" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
</button>

<div class="sheet-overlay" id="overlay">
  <div class="sheet">
    <div class="sheet-handle"><span></span></div>
    <div class="sheet-content">
      <div class="sheet-head">
        <h2 id="sheetTitle">Nouvelle fiche</h2>
        <button class="close-btn" id="closeBtn">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#5C5847" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>

      <button class="photo-btn" id="photoBtn">
        <span id="photoPlaceholder" style="display:flex;flex-direction:column;align-items:center;gap:4px;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#8A8368" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
          <span style="font-size:14px;">Ajouter une photo (appareil ou galerie)</span>
        </span>
        <img id="photoPreview" style="display:none;" />
      </button>
      <input type="file" id="fileInput" accept="image/*" style="display:none;" />

      <input class="field" id="fTitre" placeholder="Adresse ou nom de l'annonce" />
      <input class="field" id="fLieu" placeholder="Lieu / quartier / ville" />

      <div class="field-row">
        <input class="field" id="fTel" inputmode="tel" placeholder="Téléphone" />
        <input class="field" id="fAgence" placeholder="Agence / agent" />
      </div>
      <div class="field-row">
        <input class="field" id="fLoyer" inputmode="numeric" placeholder="Prix affiché (€)" />
      </div>
      <div class="field-row">
        <div style="flex:1;">
          <div class="field-label">Prix souhaité / offre (€)</div>
          <input class="field" id="fPrixSouhaite" inputmode="numeric" placeholder="0" />
        </div>
        <div style="flex:1;">
          <div class="field-label">Montant des travaux (€)</div>
          <input class="field" id="fTravaux" inputmode="numeric" placeholder="0" />
        </div>
      </div>

      <input class="field" id="fUrl" inputmode="url" placeholder="Lien de l'annonce" />

      <div class="status-label">Finances (mensuel)</div>
      <div class="field-row">
        <div style="flex:1;">
          <div class="field-label">Loyer perçu (€/mois)</div>
          <input class="field" id="fLoyerMensuel" inputmode="numeric" placeholder="0" />
        </div>
        <div style="flex:1;">
          <div class="field-label">Charges (€/mois)</div>
          <input class="field" id="fCharges" inputmode="numeric" placeholder="0" />
        </div>
      </div>
      <div class="field-row">
        <div style="flex:1;">
          <div class="field-label">Mensualité de prêt (€/mois)</div>
          <input class="field" id="fMensualite" inputmode="numeric" placeholder="0" />
        </div>
      </div>
      <div class="cashflow-display" id="cashflowDisplay">Cash-flow : 0 €/mois</div>

      <div class="field-row">
        <div style="flex:1;">
          <div class="field-label">Date de contact</div>
          <input class="field" id="fDateContact" type="date" />
        </div>
        <div style="flex:1;">
          <div class="field-label">Date de visite</div>
          <input class="field" id="fDateVisite" type="date" />
        </div>
      </div>

      <div class="status-label">Type de location</div>
      <div class="status-choices" id="typeChoices"></div>

      <textarea class="field" id="fNotes" rows="2" placeholder="Notes (optionnel)" style="margin-top:14px;"></textarea>

      <div class="status-label">Statut</div>
      <div class="status-choices" id="statusChoices"></div>

      <button class="save-btn" id="saveBtn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
        Enregistrer
      </button>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import {
  getFirestore, collection, doc, setDoc, deleteDoc, updateDoc, onSnapshot
} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCj9zvC_U94BrjJBn3WC6BJHqYtwS3p6cI",
  authDomain: "carnet-appart.firebaseapp.com",
  projectId: "carnet-appart",
  storageBucket: "carnet-appart.firebasestorage.app",
  messagingSenderId: "827562857933",
  appId: "1:827562857933:web:1962bf97cb45db6ef76084",
  measurementId: "G-CPNHXSPXK7"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const colRef = collection(db, "fiches");

const STATUSES = [
  { id: "attente", label: "En attente", color: "#B8AFD6", ink: "#2E2A44" },
  { id: "a_voir", label: "À visiter", color: "#D9A441", ink: "#4A3A14" },
  { id: "visite", label: "Visité", color: "#8FA98C", ink: "#28331F" },
  { id: "relance", label: "Offre", color: "#C98A5E", ink: "#3A230F" },
  { id: "refuse", label: "Abandon", color: "#B0A99A", ink: "#39362E" },
];
const TYPES = [
  { id: "nue", label: "Location nue" },
  { id: "meublee", label: "Meublée" },
  { id: "coloc", label: "Colocation" },
];
const statusOf = id => STATUSES.find(s => s.id === id) || STATUSES[0];
const typeOf = id => TYPES.find(t => t.id === id);

let items = [];
let loaded = false;
let filter = "tous";
let sortBy = "recent";
let currentPhoto = null;
let currentStatus = "a_voir";
let currentType = null;
let editingId = null;

onSnapshot(colRef, (snapshot) => {
  loaded = true;
  items = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
  renderAll();
}, (err) => {
  console.error(err);
  document.getElementById("list").innerHTML = `<div class="empty">Connexion à la base impossible.<br>Vérifie ta connexion internet.</div>`;
});

function escapeHtml(s) {
  return (s || "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
}
function formatDate(d) {
  if (!d) return "";
  const [y, m, day] = d.split("-");
  return `${day}/${m}/${y}`;
}

function renderFilters() {
  const el = document.getElementById("filters");
  let html = `<button class="chip ${filter==='tous' ? 'active-all' : ''}" data-filter="tous">Tous</button>`;
  STATUSES.forEach(s => {
    const active = filter === s.id;
    html += `<button class="chip" data-filter="${s.id}" style="background:${active ? s.color : 'transparent'};border-color:${s.color};color:${active ? s.ink : '#B8C0D6'}">${s.label}</button>`;
  });
  el.innerHTML = html;
  el.querySelectorAll("[data-filter]").forEach(btn => {
    btn.onclick = () => { filter = btn.dataset.filter; renderAll(); };
  });
}

function sortItems(list) {
  const copy = [...list];
  switch (sortBy) {
    case "loyer_asc":
      return copy.sort((a, b) => (parseFloat(a.loyer) || Infinity) - (parseFloat(b.loyer) || Infinity));
    case "loyer_desc":
      return copy.sort((a, b) => (parseFloat(b.loyer) || -Infinity) - (parseFloat(a.loyer) || -Infinity));
    case "lieu":
      return copy.sort((a, b) => (a.lieu || "").localeCompare(b.lieu || "", "fr"));
    case "visite":
      return copy.sort((a, b) => (b.dateVisite || "").localeCompare(a.dateVisite || ""));
    case "contact":
      return copy.sort((a, b) => (b.dateContact || "").localeCompare(a.dateContact || ""));
    default:
      return copy.sort((a, b) => b.createdAt - a.createdAt);
  }
}

function renderList() {
  const el = document.getElementById("list");
  document.getElementById("count").textContent = items.length ? `${items.length} fiche${items.length>1?'s':''}` : "";
  const filtered = sortItems(items.filter(i => filter === "tous" || i.statut === filter));

  if (!filtered.length) {
    el.innerHTML = `<div class="empty">${items.length===0 ? "Aucune fiche pour l'instant." : "Rien dans ce filtre."}</div>`;
    return;
  }

  el.innerHTML = filtered.map(item => {
    const s = statusOf(item.statut);
    const t = typeOf(item.type);
    const telClean = (item.tel || "").replace(/[^\d+]/g, "");
    const statusBtns = STATUSES.map(st => `
      <button class="status-btn" data-set-status="${item.id}" data-status="${st.id}"
        style="border:1px solid ${st.color};background:${item.statut===st.id ? st.color : 'transparent'};color:${item.statut===st.id ? st.ink : '#8A8368'}">
        ${st.label}
      </button>`).join("");
    const dates = [];
    if (item.dateContact) dates.push(`Contact : ${formatDate(item.dateContact)}`);
    if (item.dateVisite) dates.push(`Visite : ${formatDate(item.dateVisite)}`);
    const hasFinance = item.loyerMensuel || item.charges || item.mensualite;
    const cf = parseFloat(item.cashflow) || 0;
    const financeBlock = hasFinance ? `
      <div class="finance">
        <div class="fline"><span class="flabel">Loyer</span><span>${item.loyerMensuel || 0} €</span></div>
        <div class="fline"><span class="flabel">Charges</span><span>${item.charges || 0} €</span></div>
        <div class="fline"><span class="flabel">Mensualité prêt</span><span>${item.mensualite || 0} €</span></div>
        <div class="fline"><span class="flabel">Cash-flow</span><span class="${cf >= 0 ? 'cashflow-pos' : 'cashflow-neg'}">${cf >= 0 ? '+' : ''}${cf.toFixed(0)} €</span></div>
      </div>` : "";
    return `
      <div class="card">
        <div class="perf">${'<span></span>'.repeat(10)}</div>
        <div class="card-body">
          <div class="thumb">
            ${item.photo ? `<img src="${item.photo}" />` : `<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#B7AE8E" stroke-width="2"><path d="M3 12l9-9 9 9"/><path d="M9 21V12h6v9"/></svg>`}
          </div>
          <div class="card-main">
            <div class="card-top">
              <p class="card-title">${escapeHtml(item.titre)}</p>
              <div class="card-actions">
                <button class="icon-btn" data-edit="${item.id}">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8A8368" stroke-width="2"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5z"/></svg>
                </button>
                <button class="icon-btn" data-delete="${item.id}">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#B0A99A" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6h14z"/></svg>
                </button>
              </div>
            </div>
            ${item.lieu ? `<div class="lieu">📍 ${escapeHtml(item.lieu)}</div>` : ""}
            ${item.agence ? `<div class="lieu">🏢 ${escapeHtml(item.agence)}</div>` : ""}
            ${item.loyer || item.prixSouhaite || item.travaux ? `
              <div class="rent">
                ${item.loyer ? `Prix affiché : ${escapeHtml(item.loyer)} €` : ""}
                ${item.prixSouhaite ? `<br>Prix souhaité : ${escapeHtml(item.prixSouhaite)} €` : ""}
                ${item.travaux ? `<br>Travaux : ${escapeHtml(item.travaux)} €` : ""}
              </div>` : ""}
            ${t ? `<span class="type-tag">${t.label}</span>` : ""}
            <div class="links">
              ${item.tel ? `<a class="pill tel" href="tel:${telClean}">📞 ${escapeHtml(item.tel)}</a>` : ""}
              ${item.url ? `<a class="pill url" href="${escapeHtml(item.url)}" target="_blank" rel="noreferrer">🔗 Annonce</a>` : ""}
            </div>
          </div>
        </div>
        ${dates.length ? `<div class="dates">${dates.map(d => `<span>${d}</span>`).join("")}</div>` : ""}
        ${financeBlock}
        ${item.notes ? `<div class="notes">${escapeHtml(item.notes)}</div>` : ""}
        <div class="status-row">${statusBtns}</div>
        <div class="stamp" style="border:1.5px solid ${s.color};color:${s.ink}">${s.label}</div>
      </div>`;
  }).join("");

  el.querySelectorAll("[data-delete]").forEach(btn => {
    btn.onclick = async () => {
      const item = items.find(i => i.id === btn.dataset.delete);
      const nom = item ? item.titre : "cette fiche";
      if (!confirm(`Supprimer "${nom}" ? Cette action est définitive.`)) return;
      try { await deleteDoc(doc(db, "fiches", btn.dataset.delete)); }
      catch (e) { alert("Suppression impossible, vérifie ta connexion."); }
    };
  });
  el.querySelectorAll("[data-set-status]").forEach(btn => {
    btn.onclick = async () => {
      try { await updateDoc(doc(db, "fiches", btn.dataset.setStatus), { statut: btn.dataset.status }); }
      catch (e) { alert("Mise à jour impossible, vérifie ta connexion."); }
    };
  });
  el.querySelectorAll("[data-edit]").forEach(btn => {
    btn.onclick = () => openSheet(btn.dataset.edit);
  });
}

function renderAll() { renderFilters(); renderList(); }

function renderStatusChoices() {
  const el = document.getElementById("statusChoices");
  el.innerHTML = STATUSES.map(s => `
    <button class="status-choice" data-choose-status="${s.id}"
      style="border:1.5px solid ${s.color};background:${s.id===currentStatus ? s.color : 'transparent'};color:${s.id===currentStatus ? s.ink : '#4A4636'}">
      ${s.label}
    </button>`).join("");
  el.querySelectorAll("[data-choose-status]").forEach(btn => {
    btn.onclick = () => { currentStatus = btn.dataset.chooseStatus; renderStatusChoices(); };
  });
}

function renderTypeChoices() {
  const el = document.getElementById("typeChoices");
  el.innerHTML = TYPES.map(t => `
    <button class="status-choice" data-choose-type="${t.id}"
      style="border:1.5px solid #8FA9B0;background:${t.id===currentType ? '#8FA9B0' : 'transparent'};color:${t.id===currentType ? '#1D2E31' : '#4A4636'}">
      ${t.label}
    </button>`).join("");
  el.querySelectorAll("[data-choose-type]").forEach(btn => {
    btn.onclick = () => { currentType = currentType === btn.dataset.chooseType ? null : btn.dataset.chooseType; renderTypeChoices(); };
  });
}

function resetForm() {
  document.getElementById("fTitre").value = "";
  document.getElementById("fLieu").value = "";
  document.getElementById("fTel").value = "";
  document.getElementById("fAgence").value = "";
  document.getElementById("fUrl").value = "";
  document.getElementById("fLoyer").value = "";
  document.getElementById("fPrixSouhaite").value = "";
  document.getElementById("fTravaux").value = "";
  document.getElementById("fNotes").value = "";
  document.getElementById("fDateContact").value = "";
  document.getElementById("fDateVisite").value = "";
  document.getElementById("fLoyerMensuel").value = "";
  document.getElementById("fCharges").value = "";
  document.getElementById("fMensualite").value = "";
  currentStatus = "a_voir";
  currentType = null;
  currentPhoto = null;
  document.getElementById("photoPreview").style.display = "none";
  document.getElementById("photoPlaceholder").style.display = "flex";
  document.getElementById("photoBtn").classList.remove("has-photo");
  renderStatusChoices();
  renderTypeChoices();
  updateSaveBtn();
  updateCashflowDisplay();
}

function fillForm(item) {
  document.getElementById("fTitre").value = item.titre || "";
  document.getElementById("fLieu").value = item.lieu || "";
  document.getElementById("fTel").value = item.tel || "";
  document.getElementById("fAgence").value = item.agence || "";
  document.getElementById("fUrl").value = item.url || "";
  document.getElementById("fLoyer").value = item.loyer || "";
  document.getElementById("fPrixSouhaite").value = item.prixSouhaite || "";
  document.getElementById("fTravaux").value = item.travaux || "";
  document.getElementById("fNotes").value = item.notes || "";
  document.getElementById("fDateContact").value = item.dateContact || "";
  document.getElementById("fDateVisite").value = item.dateVisite || "";
  document.getElementById("fLoyerMensuel").value = item.loyerMensuel || "";
  document.getElementById("fCharges").value = item.charges || "";
  document.getElementById("fMensualite").value = item.mensualite || "";
  currentStatus = item.statut || "a_voir";
  currentType = item.type || null;
  currentPhoto = item.photo || null;
  if (currentPhoto) {
    const img = document.getElementById("photoPreview");
    img.src = currentPhoto;
    img.style.display = "block";
    document.getElementById("photoPlaceholder").style.display = "none";
    document.getElementById("photoBtn").classList.add("has-photo");
  }
  renderStatusChoices();
  renderTypeChoices();
  updateSaveBtn();
  updateCashflowDisplay();
}

function updateSaveBtn() {
  const btn = document.getElementById("saveBtn");
  const ok = document.getElementById("fTitre").value.trim().length > 0;
  btn.classList.toggle("enabled", ok);
}

function updateCashflowDisplay() {
  const loyer = parseFloat(document.getElementById("fLoyerMensuel").value) || 0;
  const charges = parseFloat(document.getElementById("fCharges").value) || 0;
  const mensualite = parseFloat(document.getElementById("fMensualite").value) || 0;
  const cashflow = loyer - charges - mensualite;
  const el = document.getElementById("cashflowDisplay");
  el.textContent = `Cash-flow : ${cashflow >= 0 ? "+" : ""}${cashflow.toFixed(0)} €/mois`;
  el.style.color = cashflow >= 0 ? "#3C6B41" : "#B84A3E";
  return cashflow;
}
["fLoyerMensuel", "fCharges", "fMensualite"].forEach(id => {
  document.getElementById(id).addEventListener("input", updateCashflowDisplay);
});

function compressImage(dataUrl, maxDim, quality) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      let { width, height } = img;
      if (width > height && width > maxDim) { height = Math.round(height * maxDim / width); width = maxDim; }
      else if (height > maxDim) { width = Math.round(width * maxDim / height); height = maxDim; }
      const canvas = document.createElement("canvas");
      canvas.width = width; canvas.height = height;
      canvas.getContext("2d").drawImage(img, 0, 0, width, height);
      resolve(canvas.toDataURL("image/jpeg", quality));
    };
    img.onerror = () => resolve(null);
    img.src = dataUrl;
  });
}

document.getElementById("photoBtn").onclick = () => document.getElementById("fileInput").click();
document.getElementById("fileInput").onchange = async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async () => {
    const compressed = await compressImage(reader.result, 640, 0.72);
    currentPhoto = compressed || reader.result;
    const img = document.getElementById("photoPreview");
    img.src = currentPhoto;
    img.style.display = "block";
    document.getElementById("photoPlaceholder").style.display = "none";
    document.getElementById("photoBtn").classList.add("has-photo");
  };
  reader.readAsDataURL(file);
};

["fTitre"].forEach(id => document.getElementById(id).addEventListener("input", updateSaveBtn));

document.getElementById("saveBtn").onclick = async () => {
  const titre = document.getElementById("fTitre").value.trim();
  if (!titre) return;
  const btn = document.getElementById("saveBtn");
  const loyerMensuel = document.getElementById("fLoyerMensuel").value.trim();
  const charges = document.getElementById("fCharges").value.trim();
  const mensualite = document.getElementById("fMensualite").value.trim();
  const cashflow = (parseFloat(loyerMensuel) || 0) - (parseFloat(charges) || 0) - (parseFloat(mensualite) || 0);
  const data = {
    titre,
    lieu: document.getElementById("fLieu").value.trim(),
    tel: document.getElementById("fTel").value.trim(),
    agence: document.getElementById("fAgence").value.trim(),
    url: document.getElementById("fUrl").value.trim(),
    loyer: document.getElementById("fLoyer").value.trim(),
    prixSouhaite: document.getElementById("fPrixSouhaite").value.trim(),
    travaux: document.getElementById("fTravaux").value.trim(),
    notes: document.getElementById("fNotes").value.trim(),
    dateContact: document.getElementById("fDateContact").value,
    dateVisite: document.getElementById("fDateVisite").value,
    loyerMensuel,
    charges,
    mensualite,
    cashflow,
    statut: currentStatus,
    type: currentType,
    photo: currentPhoto,
  };
  try {
    btn.disabled = true;
    if (editingId) {
      await setDoc(doc(db, "fiches", editingId), data, { merge: true });
    } else {
      const newRef = doc(colRef);
      await setDoc(newRef, { ...data, createdAt: Date.now() });
    }
    closeSheet();
  } catch (e) {
    console.error(e);
    alert("Impossible d'enregistrer. Vérifie ta connexion internet.");
  } finally {
    btn.disabled = false;
  }
};

function openSheet(id) {
  editingId = id || null;
  resetForm();
  if (id) {
    const item = items.find(i => i.id === id);
    if (item) fillForm(item);
    document.getElementById("sheetTitle").textContent = "Modifier la fiche";
  } else {
    document.getElementById("sheetTitle").textContent = "Nouvelle fiche";
  }
  document.getElementById("overlay").classList.add("open");
}
function closeSheet() {
  document.getElementById("overlay").classList.remove("open");
  editingId = null;
}

document.getElementById("fabBtn").onclick = () => openSheet(null);
document.getElementById("closeBtn").onclick = closeSheet;
document.getElementById("overlay").onclick = (e) => { if (e.target.id === "overlay") closeSheet(); };
document.getElementById("sortSelect").onchange = (e) => { sortBy = e.target.value; renderList(); };

</script>
